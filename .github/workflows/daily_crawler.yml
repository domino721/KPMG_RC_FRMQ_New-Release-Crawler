name: Daily News Release Crawler

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *' # 매일 자정(UTC)에 실행 (한국 시간 오전 9시)
  workflow_dispatch: # 수동으로도 실행 가능하게 설정

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run crawler
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        RELEASE_CRAWLER_RECIPIENTS: ${{ secrets.RELEASE_CRAWLER_RECIPIENTS }}
        HISTORY_FILE: "history.json"
      run: python new_release_crawler.py

    - name: Commit and push history.json
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add history.json
        git commit -m "Update history.json [skip ci]" || echo "No changes to commit"
        git push




